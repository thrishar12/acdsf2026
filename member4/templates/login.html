<!DOCTYPE html>
<html>
<head>
    <title>ACDSF - Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080c18;
            font-family: Arial, sans-serif;
            color: white;
        }
        .login-box {
            background: rgba(13,21,40,0.9);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(0,212,255,0.2);
            width: 350px;
        }
        h1 { text-align: center; color: #00d4ff; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid rgba(30,48,80,0.4);
            background: rgba(0,0,0,0.3);
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            color: #080c18;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .hint {
            text-align: center;
            color: #4a6a8a;
            font-size: 12px;
            margin-top: 16px;
            line-height: 1.6;
        }
        .hint strong { color: #00d4ff; }
        .flash {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
        }
        .flash-danger { background: rgba(255,68,102,0.15); color: #ff4466; }
        .flash-success { background: rgba(0,255,136,0.15); color: #00ff88; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 Login</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">🚀 Access Dashboard</button>
        </form>
        <div class="hint">
            🔑 <strong>admin</strong> / <strong>analyst</strong> / <strong>commander</strong><br>
            Password: <strong>acdsf2024</strong>
        </div>
    </div>
</body>
</html>
