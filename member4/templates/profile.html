<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACDSF - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #080c18;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .profile-card {
            background: rgba(13,21,40,0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(0,212,255,0.15);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .profile-card .avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            margin: 0 auto 16px;
            color: #080c18;
        }
        .profile-card h1 {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .profile-card .role {
            color: #4a6a8a;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .profile-card .divider {
            height: 1px;
            background: rgba(30,48,80,0.3);
            margin: 20px 0;
        }
        .profile-card .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(30,48,80,0.1);
        }
        .profile-card .info-row .label { color: #4a6a8a; }
        .profile-card .info-row .value { font-weight: 600; }
        .btn-back {
            margin-top: 20px;
            padding: 12px 32px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            color: #080c18;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,212,255,0.3);
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="avatar">{{ user.username[0].upper() }}</div>
        <h1>{{ user.username }}</h1>
        <div class="role">{{ user.role }}</div>

        <div class="divider"></div>

        <div class="info-row"><span class="label">Email</span><span class="value">{{ user.email }}</span></div>
        <div class="info-row"><span class="label">User ID</span><span class="value">#{{ user.id }}</span></div>
        <div class="info-row"><span class="label">Status</span><span class="value green">Active</span></div>

        <a href="{{ url_for('dashboard') }}" class="btn-back">← Back to Dashboard</a>
    </div>
</body>
</html>
