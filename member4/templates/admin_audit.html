<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ACDSF - Audit Log</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #080c18;
            color: #e8edf5;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(13,21,40,0.85);
            border-radius: 14px;
            border: 1px solid rgba(0,212,255,0.1);
            margin-bottom: 20px;
        }
        .header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header a {
            color: #4a6a8a;
            text-decoration: none;
            transition: color 0.3s;
        }
        .header a:hover { color: #00d4ff; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(13,21,40,0.6);
            border-radius: 12px;
            overflow: hidden;
        }
        th {
            background: rgba(0,212,255,0.08);
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            color: #4a6a8a;
            letter-spacing: 1px;
        }
        td {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(30,48,80,0.15);
            font-size: 13px;
        }
        tr:hover td { background: rgba(0,212,255,0.03); }
        .action-login { color: #00ff88; }
        .action-logout { color: #ffbb33; }
        .action-block { color: #ff4466; }
        .action-view { color: #00d4ff; }
        .back-btn {
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(30,48,80,0.3);
            background: rgba(0,0,0,0.3);
            color: #e8edf5;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
        }
        .back-btn:hover { border-color: #00d4ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Audit Log</h1>
            <a href="{{ url_for('dashboard') }}" class="back-btn">← Dashboard</a>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Time</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Details</th>
                    <th>IP</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log.created_at[:16] if log.created_at else '-' }}</td>
                    <td>{{ log.username or 'System' }}</td>
                    <td><span class="action-{{ log.action.lower() }}">{{ log.action }}</span></td>
                    <td>{{ log.details or '-' }}</td>
                    <td>{{ log.ip_address or '-' }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
