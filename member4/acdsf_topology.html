<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACDSF - Network Topology</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: linear-gradient(135deg, #0d1b2a, #1b2d45);
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid #1e3a5f;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .status {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }
        .topology-container {
            background: #0d1528;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #1e3050;
            min-height: 600px;
            position: relative;
        }
        .node {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            border: 2px solid #1e3a5f;
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
            padding: 10px;
        }
        .node:hover {
            transform: scale(1.1);
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }
        .node .icon {
            font-size: 28px;
            margin-bottom: 4px;
        }
        .node .name {
            font-size: 11px;
            color: #8899bb;
        }
        .node .health {
            font-size: 18px;
            font-weight: 700;
            margin-top: 2px;
        }
        .node-center {
            background: #1b2d45;
            border-color: #00d4ff;
            width: 140px;
            height: 140px;
        }
        .node-center .icon {
            font-size: 34px;
        }
        .node-center .name {
            color: #00d4ff;
        }

        /* Connection lines */
        .connection {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, #1e3a5f, #00d4ff);
            transform-origin: 0 0;
            opacity: 0.3;
            transition: opacity 0.5s;
        }
        .connection.active {
            opacity: 0.8;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        .connection.attack {
            opacity: 1;
            background: linear-gradient(90deg, #ff4466, #ff8833);
            box-shadow: 0 0 20px rgba(255, 68, 102, 0.5);
            animation: attackPulse 1s infinite alternate;
        }
        @keyframes attackPulse {
            0% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
            }
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding: 15px 20px;
            background: #111a2e;
            border-radius: 10px;
            border: 1px solid #1e3050;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #8899bb;
        }
        .legend-item .color-box {
            width: 20px;
            height: 4px;
            border-radius: 2px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 8px 20px;
            background: #1b2d45;
            border: 1px solid #1e3a5f;
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .controls button:hover {
            background: #2a4a7a;
            border-color: #00d4ff;
        }
        .controls button.active {
            background: #00d4ff33;
            border-color: #00d4ff;
        }

        .footer {
            text-align: center;
            color: #445577;
            font-size: 13px;
            margin-top: 30px;
            padding: 10px;
            border-top: 1px solid #1a2640;
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: #1b2d45;
            border: 1px solid #00d4ff;
            border-radius: 10px;
            padding: 15px 20px;
            z-index: 1000;
            display: none;
            min-width: 200px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
        .tooltip .title {
            color: #00d4ff;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .tooltip .detail {
            color: #8899bb;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌐 Network Topology · 6 Sectors</h1>
        <div class="status">
            <span class="status-dot"></span>
            <span class="status-text" id="statusText">Live</span>
        </div>
    </div>

    <div class="controls">
        <button id="btnNormal" class="active">📊 Normal View</button>
        <button id="btnAttack">⚔️ Simulate Attack</button>
        <button id="btnReset">🔄 Reset</button>
    </div>

    <div class="topology-container" id="topologyContainer">
        <!-- Nodes will be placed by JavaScript -->
        <!-- Connections will be drawn by JavaScript -->
    </div>

    <div class="legend">
        <div class="legend-item"><span class="color-box" style="background:#00ff88;"></span> Normal Traffic</div>
        <div class="legend-item"><span class="color-box" style="background:#00d4ff;"></span> Backbone Connection</div>
        <div class="legend-item"><span class="color-box" style="background:#ff4466;"></span> Attack Path</div>
        <div class="legend-item"><span class="color-box" style="background:#ff8833;"></span> Active Threat</div>
        <div class="legend-item" style="margin-left:auto;"><span id="alertCount">🚨 0 active alerts</span></div>
    </div>

    <div class="footer">
        ACDSF — AI-Powered Cyber Defence Simulation Framework &bull; Live Network Topology
    </div>

    <div class="tooltip" id="tooltip">
        <div class="title" id="tooltipTitle">Node</div>
        <div class="detail" id="tooltipDetail">Details</div>
    </div>

    <script>
        const API_URL = 'http://localhost:8010';

        const sectors = [
            { id: 'government', name: 'Government', icon: '🏛', x: 20, y: 20, color: '#00d4ff' },
            { id: 'energy', name: 'Energy', icon: '⚡', x: 70, y: 10, color: '#ff8833' },
            { id: 'finance', name: 'Finance', icon: '💰', x: 50, y: 45, color: '#00ff88' },
            { id: 'telecom', name: 'Telecom', icon: '📡', x: 25, y: 70, color: '#b388ff' },
            { id: 'water', name: 'Water', icon: '💧', x: 75, y: 55, color: '#00b4ff' },
            { id: 'transport', name: 'Transport', icon: '🚆', x: 45, y: 80, color: '#ffbb33' },
        ];

        // Connections between sectors (source, target)
        const connections = [
            ['government', 'energy'],
            ['government', 'finance'],
            ['government', 'telecom'],
            ['energy', 'water'],
            ['energy', 'transport'],
            ['finance', 'telecom'],
            ['finance', 'water'],
            ['telecom', 'transport'],
            ['water', 'transport'],
        ];

        let healthData = {};
        let isAttackMode = false;

        function getPosition(element) {
            const rect = element.getBoundingClientRect();
            const container = document.getElementById('topologyContainer');
            const containerRect = container.getBoundingClientRect();
            return {
                x: rect.left - containerRect.left + rect.width / 2,
                y: rect.top - containerRect.top + rect.height / 2
            };
        }

        function createNode(sector) {
            const container = document.getElementById('topologyContainer');
            const node = document.createElement('div');
            node.className = 'node';
            node.id = `node-${sector.id}`;
            node.style.left = sector.x + '%';
            node.style.top = sector.y + '%';
            node.style.transform = 'translate(-50%, -50%)';

            const health = healthData[sector.name] || 85;
            const color = health >= 80 ? '#00ff88' : health >= 60 ? '#ffbb33' : '#ff4466';

            node.innerHTML = `
                <div class="icon">${sector.icon}</div>
                <div class="name">${sector.name}</div>
                <div class="health" style="color:${color}">${health}%</div>
            `;

            node.addEventListener('mouseenter', (e) => showTooltip(e, sector, health));
            node.addEventListener('mouseleave', hideTooltip);
            node.addEventListener('click', () => {
                alert(`📊 ${sector.name} Sector\nHealth: ${health}%\nStatus: ${health >= 80 ? '✅ Healthy' : health >= 60 ? '⚠️ Degraded' : '🔴 Critical'}`);
            });

            container.appendChild(node);
            return node;
        }

        function createConnection(sourceId, targetId, nodes) {
            const container = document.getElementById('topologyContainer');
            const source = nodes.find(n => n.id === sourceId);
            const target = nodes.find(n => n.id === targetId);
            if (!source || !target) return;

            const line = document.createElement('div');
            line.className = 'connection';
            line.id = `conn-${sourceId}-${targetId}`;

            // Position will be updated in updateConnections
            container.appendChild(line);
            return line;
        }

        function updateConnections() {
            const container = document.getElementById('topologyContainer');
            const lines = container.querySelectorAll('.connection');
            const nodeElements = container.querySelectorAll('.node');

            lines.forEach(line => {
                const ids = line.id.replace('conn-', '').split('-');
                const sourceEl = document.getElementById(`node-${ids[0]}`);
                const targetEl = document.getElementById(`node-${ids[1]}`);
                if (!sourceEl || !targetEl) return;

                const sourcePos = getPosition(sourceEl);
                const targetPos = getPosition(targetEl);

                const dx = targetPos.x - sourcePos.x;
                const dy = targetPos.y - sourcePos.y;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;

                line.style.width = length + 'px';
                line.style.left = sourcePos.x + 'px';
                line.style.top = sourcePos.y + 'px';
                line.style.transform = `rotate(${angle}deg)`;
            });
        }

        function showTooltip(e, sector, health) {
            const tooltip = document.getElementById('tooltip');
            document.getElementById('tooltipTitle').textContent = `${sector.icon} ${sector.name} Sector`;
            document.getElementById('tooltipDetail').innerHTML = `
                Health: <strong style="color:${health >= 80 ? '#00ff88' : health >= 60 ? '#ffbb33' : '#ff4466'}">${health}%</strong><br>
                Status: ${health >= 80 ? '✅ Healthy' : health >= 60 ? '⚠️ Degraded' : '🔴 Critical'}<br>
                Click for details
            `;
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX + 15) + 'px';
            tooltip.style.top = (e.clientY - 10) + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }

        function updateHealthColors() {
            const nodes = document.querySelectorAll('.node');
            nodes.forEach(node => {
                const sectorName = node.querySelector('.name')?.textContent;
                if (!sectorName) return;
                const health = healthData[sectorName] || 85;
                const color = health >= 80 ? '#00ff88' : health >= 60 ? '#ffbb33' : '#ff4466';
                const healthEl = node.querySelector('.health');
                if (healthEl) {
                    healthEl.textContent = health + '%';
                    healthEl.style.color = color;
                }
                node.style.borderColor = color;
            });
        }

        function updateAlertCount() {
            document.getElementById('alertCount').textContent = `🚨 ${Math.floor(Math.random() * 5)} active alerts`;
        }

        function toggleAttackMode() {
            isAttackMode = !isAttackMode;
            const lines = document.querySelectorAll('.connection');
            lines.forEach((line, index) => {
                if (isAttackMode && index < 3) {
                    line.className = 'connection attack';
                } else {
                    line.className = 'connection';
                }
            });
            document.getElementById('btnAttack').className = isAttackMode ? 'active' : '';
            document.getElementById('statusText').textContent = isAttackMode ? '⚠️ ATTACK DETECTED' : 'Live';
            document.getElementById('statusText').style.color = isAttackMode ? '#ff4466' : '#00ff88';
        }

        function resetTopology() {
            isAttackMode = false;
            document.querySelectorAll('.connection').forEach(line => {
                line.className = 'connection';
            });
            document.getElementById('btnAttack').className = '';
            document.getElementById('statusText').textContent = 'Live';
            document.getElementById('statusText').style.color = '#00ff88';
        }

        async function refreshTopology() {
            try {
                // Fetch sector health from API
                const response = await fetch(`${API_URL}/api/sectors`);
                if (response.ok) {
                    healthData = await response.json();
                    updateHealthColors();
                    updateConnections();
                    updateAlertCount();
                }
            } catch (error) {
                console.log('Using fallback data');
                // Fallback: generate random health
                const names = ['Government', 'Energy', 'Finance', 'Telecom', 'Water', 'Transport'];
                names.forEach(name => {
                    healthData[name] = Math.floor(Math.random() * 30) + 65;
                });
                updateHealthColors();
                updateConnections();
            }
        }

        function initializeTopology() {
            // Create nodes
            const nodeElements = sectors.map(s => createNode(s));

            // Create connections
            connections.forEach(([source, target]) => {
                createConnection(source, target, sectors);
            });

            // Initial positioning
            setTimeout(updateConnections, 100);

            // Setup controls
            document.getElementById('btnNormal').addEventListener('click', resetTopology);
            document.getElementById('btnAttack').addEventListener('click', toggleAttackMode);
            document.getElementById('btnReset').addEventListener('click', () => {
                resetTopology();
                refreshTopology();
            });

            // Initial data load
            refreshTopology();

            // Refresh every 3 seconds
            setInterval(refreshTopology, 3000);

            // Update on window resize
            window.addEventListener('resize', updateConnections);
        }

        // Start when page loads
        document.addEventListener('DOMContentLoaded', initializeTopology);
    </script>

</body>
</html>
