<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ACDSF — AI-Powered Cyber Defence Simulation Framework. Real-time digital twin, autonomous Red vs Blue AI, MITRE ATT&CK threat intelligence and explainable AI for national security." />
    <meta name="theme-color" content="#030712" />
    <title>ACDSF — National Cyber Defence Command Center</title>

    <script>
      try {
        const theme = localStorage.getItem('acdsf-theme');
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Cyber Font Stack:
        Orbitron      → Headings, logo, big numbers
        Rajdhani      → Subheadings, navbar, buttons
        Exo 2         → Body text
        JetBrains Mono → Terminal / logs / code / IPs
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
